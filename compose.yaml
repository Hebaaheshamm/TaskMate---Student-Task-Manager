services:
  taskmate:
    build: .
    restart: unless-stopped
    ports:
      - "${TASKMATE_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/taskmate.db;Cache=Shared;Foreign Keys=True"
      Authentication__Jwt__SigningKey: ${TASKMATE_JWT_SECRET:?Set TASKMATE_JWT_SECRET to a unique secret of at least 32 characters}
      AllowedHosts: ${TASKMATE_ALLOWED_HOSTS:-*}
    volumes:
      - taskmate-data:/app/data

volumes:
  taskmate-data:
